global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090
          -
  - job_name: "kafka_exporter"
    static_configs:
      - targets:
          - kafka_exporter:9308
  - job_name: "spark"
    static_configs:
      - targets:
          - consumer_user_purchase:8000
          - consumer_user_purchase:8090
  - job_name: "producer"
    static_configs:
      - targets:
          - producer:8000